<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pez Merge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="top">
    <h1>Pez Merge</h1>
    <div class="sc"><small>Puntos</small><b id="sc">0</b></div>
    <div class="sc"><small>Récord</small><b id="bs">0</b></div>
  </header>
  <ol class="chain" id="chain" aria-label="Evolución de las fichas"></ol>
  <main class="board" id="board">
    <div class="grid" id="grid"></div>
    <div class="tiles" id="tiles"></div>
    <div class="ov" id="ov" role="dialog" aria-live="polite">
      <h2 id="mt"></h2>
      <p id="mp"></p>
      <div class="row">
        <button class="b" id="mk">Seguir jugando</button>
        <button class="b alt" id="mn">Nuevo juego</button>
      </div>
    </div>
  </main>
  <div class="row">
    <button class="b" id="nw">Nuevo juego</button>
    <button class="b alt" id="tp" aria-pressed="false">Botones</button>
  </div>
  <div class="dpad" id="dpad" hidden></div>
  <p class="hint">Desliza sobre el tablero para mover. Dos fichas iguales se fusionan y evolucionan.</p>
</div>
<script src="script.js" defer></script>
</body>
</html>
