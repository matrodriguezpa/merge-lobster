<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Merge Lobster</title>
<style>
:root{--bg:#f2f5f8;--fg:#14202b;--mut:#5b6b79;--btn:#e3e9ef;--card:#fdfdfd;--acc:#2f7fd1;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1720;--fg:#e8eef4;--mut:#9fb0bf;--btn:#1f2d3a;--acc:#5aa6f0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1720;--fg:#e8eef4;--mut:#9fb0bf;--btn:#1f2d3a;--acc:#5aa6f0;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
.app{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px;box-sizing:border-box;touch-action:none;user-select:none;-webkit-user-select:none}
header{width:var(--s);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-size:20px;margin:0;flex:1;white-space:nowrap}
button{font:inherit;color:var(--fg);background:var(--btn);border:0;border-radius:12px;min-height:44px;padding:0 14px;cursor:pointer}
button:active{transform:scale(.96)}
button[aria-pressed="true"]{background:var(--acc);color:#fff}
.stat{width:var(--s);display:flex;justify-content:space-between;color:var(--mut);font-size:14px}
#legend{display:flex;align-items:center;gap:5px;width:var(--s);justify-content:center}
#legend img{height:30px;width:30px;object-fit:contain;background:var(--card);border-radius:8px;padding:2px;opacity:.5;box-sizing:content-box}
#legend img.on{opacity:1;outline:3px solid var(--acc)}
#legend i{color:var(--mut);font-style:normal;font-size:12px}
#board{--s:inherit;position:relative;width:var(--s);height:var(--s);background:var(--card);border-radius:22px;box-shadow:0 6px 24px rgba(0,0,0,.18);overflow:hidden}
.app{--s:min(92vw,50vh,440px)}
.core{position:absolute;left:33.333%;top:33.333%;width:33.333%;height:33.333%;box-sizing:border-box;border:2px dashed rgba(20,32,43,.18);border-radius:24%}
.core.fl{animation:fl .45s}
@keyframes fl{50%{border-color:#2f7fd1;background:rgba(47,127,209,.14)}}
.tile{position:absolute;left:0;top:0;width:33.3333%;height:33.3333%;padding:7%;box-sizing:border-box;transition:transform .15s ease-out}
.tile img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;-webkit-user-drag:none}
.pop img{animation:pop .28s ease-out}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.ov{position:absolute;inset:0;background:rgba(253,253,253,.95);display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;color:#14202b;padding:16px}
.ov.show{display:flex}
.ov img{max-height:46%;max-width:60%;border-radius:10px}
.ov h2{margin:0;font-size:24px}.ov p{margin:0;color:#4a5a68}
.ov button{background:#2f7fd1;color:#fff}
#pad{display:none;grid-template-columns:repeat(3,64px);grid-template-areas:". u ." "l d r";gap:8px}
#pad.show{display:grid}
#pad button{width:64px;height:64px;font-size:22px;padding:0}
small{color:var(--mut);text-align:center;max-width:var(--s)}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Merge Lobster</h1>
    <button id="tg" aria-pressed="false" title="Mostrar botones de dirección">🎮 Botones</button>
    <button id="rs" title="Reiniciar">↻</button>
  </header>
  <div id="legend"></div>
  <div class="stat"><span id="lvl"></span><span id="mv"></span></div>
  <div id="board">
    <div class="core"></div>
    <div class="ov" id="win"><img id="wimg" alt=""><h2>¡Lo lograste!</h2><p id="wtx"></p><button class="again">Jugar de nuevo</button></div>
    <div class="ov" id="lose"><h2>Sin movimientos</h2><p>El tablero quedó bloqueado.</p><button class="again">Reintentar</button></div>
  </div>
  <div id="pad">
    <button data-d="2" style="grid-area:u" aria-label="Arriba">▲</button>
    <button data-d="0" style="grid-area:l" aria-label="Izquierda">◀</button>
    <button data-d="3" style="grid-area:d" aria-label="Abajo">▼</button>
    <button data-d="1" style="grid-area:r" aria-label="Derecha">▶</button>
  </div>
  <small>Desliza para mover. Une fichas iguales; la del centro es fija: llévale una igual para subirla de nivel.</small>
  <small>Inspirado en el vídeo de @lobster.meme</small>
</div>

const NAMES=["","Labios","Gato-pez","Pez con zapatillas","Langosta","Pulpo azul","La cima"];
const N=9,C=4,WIN=6;
const LINES=[[[0,1,2],[3,4,5],[6,7,8]],[[2,1,0],[5,4,3],[8,7,6]],[[0,3,6],[1,4,7],[2,5,8]],[[6,3,0],[7,4,1],[8,5,2]]];
const $=id=>document.getElementById(id), board=$("board");
let lv,els,moves,busy,over;
IMG.forEach(s=>{if(s)new Image().src=s});
// leyenda de evolución
$("legend").innerHTML=IMG.slice(1).map((s,i)=>`<img src="${s}" alt="${NAMES[i+1]}">`).join("<i>▸</i>");

function place(d,i){d.style.transform=`translate(${(i%3)*100}%,${Math.floor(i/3)*100}%)`}
function pop(d){d.classList.remove("pop");void d.offsetWidth;d.classList.add("pop")}
function mk(i,l,p){const d=document.createElement("div");d.className="tile"+(p?" pop":"");const im=new Image();im.src=IMG[l];im.alt=NAMES[l];im.draggable=false;d.appendChild(im);place(d,i);board.appendChild(d);return d}
function ui(){
  $("mv").textContent="Movimientos: "+moves;
  $("lvl").textContent="Centro: "+NAMES[lv[C]];
  [...$("legend").querySelectorAll("img")].forEach((im,i)=>im.classList.toggle("on",i+1===lv[C]));
}

// Calcula un movimiento. El centro es fijo y solo absorbe fichas iguales de su mismo nivel.
function plan(g,d){
  const mv=[],up=[];let ch=false;
  for(const L of LINES[d]){
    if(L[1]===C){
      const b=L[2];
      if(g[b]&&g[b]===g[C]&&g[C]<WIN){mv.push({f:b,t:C,gone:1});up.push(C);ch=true}
    }else{
      const out=[];
      for(const i of L){
        if(!g[i])continue;
        const last=out[out.length-1];
        if(last&&!last.m&&last.l===g[i]&&g[i]<WIN){last.m=1;mv.push({f:i,t:L[out.length-1],gone:1});up.push(L[out.length-1]);ch=true}
        else out.push({i,l:g[i],m:0});
      }
      out.forEach((o,k)=>{if(o.i!==L[k])ch=true;mv.push({f:o.i,t:L[k],gone:0})});
    }
  }
  const ng=g.slice();
  mv.forEach(m=>ng[m.f]=0);
  mv.forEach(m=>{if(!m.gone)ng[m.t]=g[m.f]});
  up.forEach(i=>ng[i]++);
  return{mv,up,ch,ng};
}

function move(d){
  if(busy||over)return;
  const p=plan(lv,d);
  if(!p.ch)return;
  busy=1;moves++;
  const ne=Array(N).fill(null),gone=[];
  p.mv.forEach(m=>{const e=els[m.f];place(e,m.t);if(m.gone)gone.push(e);else ne[m.t]=e});
  for(let i=0;i<N;i++)if(els[i]&&!p.mv.some(m=>m.f===i))ne[i]=els[i];
  setTimeout(()=>{
    gone.forEach(e=>e.remove());
    p.up.forEach(i=>{ne[i].firstChild.src=IMG[p.ng[i]];ne[i].firstChild.alt=NAMES[p.ng[i]];pop(ne[i]);if(i===C){const c=document.querySelector(".core");c.classList.remove("fl");void c.offsetWidth;c.classList.add("fl")}});
    lv=p.ng;els=ne;settle();
  },170);
}

function settle(){
  if(lv.some(l=>l>=WIN)){over=1;$("wimg").src=IMG[6];$("wtx").textContent="Llegaste a la cima en "+moves+" movimientos.";$("win").classList.add("show");ui();return}
  // sin fusiones posibles (todos los niveles distintos): se rellenan los huecos con labios
  const seen=new Set();let pair=false;
  lv.forEach(l=>{if(l){if(seen.has(l))pair=true;seen.add(l)}});
  if(!pair){lv.forEach((l,i)=>{if(!l){lv[i]=1;els[i]=mk(i,1,1)}})}
  ui();
  if(![0,1,2,3].some(d=>plan(lv,d).ch)){over=1;$("lose").classList.add("show")}
  busy=0;
}

function start(){
  board.querySelectorAll(".tile").forEach(e=>e.remove());
  $("win").classList.remove("show");$("lose").classList.remove("show");
  lv=Array(N).fill(1);els=lv.map((l,i)=>mk(i,l,1));
  moves=0;busy=0;over=0;ui();
}

// Entrada: deslizar (táctil o ratón), teclado y botones
let sx=0,sy=0,sid=null,onBtn=false;
addEventListener("pointerdown",e=>{sx=e.clientX;sy=e.clientY;sid=e.pointerId;onBtn=!!e.target.closest("button")});
addEventListener("pointerup",e=>{
  if(sid!==e.pointerId||onBtn)return;sid=null;
  const dx=e.clientX-sx,dy=e.clientY-sy;
  if(Math.max(Math.abs(dx),Math.abs(dy))<28)return;
  move(Math.abs(dx)>Math.abs(dy)?(dx<0?0:1):(dy<0?2:3));
});
addEventListener("pointercancel",()=>{sid=null});
addEventListener("keydown",e=>{
  const k={ArrowLeft:0,a:0,A:0,ArrowRight:1,d:1,D:1,ArrowUp:2,w:2,W:2,ArrowDown:3,s:3,S:3}[e.key];
  if(k!==undefined){e.preventDefault();move(k)}
});
$("pad").querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>move(+b.dataset.d)));
function setPad(on){$("pad").classList.toggle("show",on);$("tg").setAttribute("aria-pressed",on);try{localStorage.setItem("ml-pad",on?"1":"0")}catch(e){}}
$("tg").addEventListener("click",()=>setPad(!$("pad").classList.contains("show")));
$("rs").addEventListener("click",start);
document.querySelectorAll(".again").forEach(b=>b.addEventListener("click",start));
try{if(localStorage.getItem("ml-pad")==="1")setPad(true)}catch(e){}
start();
</script>
